<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Iframe</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 12px 16px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .title {
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        a.back-link {
            color: #58a6ff;
            text-decoration: none;
            font-weight: 600;
        }

        a.back-link:hover {
            text-decoration: underline;
        }

        .frame-wrap {
            flex: 1;
            background: #0d1117;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <header>
        <div class="title">Test Iframe</div>
        <a class="back-link" href="{{ url_for('index') }}">← Back</a>
    </header>
    <div class="frame-wrap">
        <iframe src="{{ test_iframe_url }}" allowfullscreen referrerpolicy="no-referrer"></iframe>
    </div>
</body>
</html>
