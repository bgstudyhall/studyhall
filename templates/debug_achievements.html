<!DOCTYPE html>
<html>
<head>
    <title>Debug - Idle Dice Achievements</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 {
            color: #4ec9b0;
        }
        .achievement {
            background: #252526;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #007acc;
        }
        .key {
            color: #9cdcfe;
        }
        .value {
            color: #ce9178;
        }
    </style>
</head>
<body>
    <h1>Idle Dice Achievement Debug</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');

        // Get all localStorage keys
        const allKeys = Object.keys(localStorage);

        // Filter for Idle Dice keys that contain "a_value"
        const achievementKeys = allKeys.filter(key =>
            key.includes('Idle') && key.includes('a_value')
        ).sort();

        output.innerHTML = '<h2>All Achievement Keys Found (' + achievementKeys.length + '):</h2>';
        output.innerHTML += '<p style="color: #4ec9b0;">Copy all the achievement IDs below and send them to me!</p>';

        // Create a list of just the IDs for easy copying
        const ids = [];

        achievementKeys.forEach(key => {
            const value = localStorage.getItem(key);
            const achievementId = key.replace('Idle dice_a_value_', '');
            ids.push(achievementId);

            output.innerHTML += `<div class="achievement">
                <strong>Achievement ID:</strong> <span style="color: #ffd700;">${achievementId}</span><br>
                <span class="key">Full Key:</span> ${key}<br>
                <span class="value">Value:</span> ${value}
            </div>`;
        });

        // Add a copyable list at the top
        output.innerHTML = '<h2>All Achievement Keys Found (' + achievementKeys.length + '):</h2>' +
                          '<div style="background: #000; padding: 15px; margin: 10px 0; border: 2px solid #4ec9b0;">' +
                          '<strong style="color: #4ec9b0;">Achievement IDs (copy this list):</strong><br>' +
                          '<pre style="color: #ffd700; user-select: all;">' + ids.join('\n') + '</pre>' +
                          '</div>' +
                          output.innerHTML;

        // Also log to console
        console.log('All Achievement IDs:', ids);
    </script>
</body>
</html>
