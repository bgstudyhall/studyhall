<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hall</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ========================================
           GLOBAL RESET & SNAPPHAT THEME
        ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Snapchat Color Scheme */
            --snap-yellow: #FFFC00;
            --snap-yellow-dark: #FFD700;

            /* Clean backgrounds */
            --snap-bg: #FFFFFF;
            --snap-bg-gray: #F7F7F7;
            --snap-bg-darker: #EEEEEE;

            /* Text colors */
            --snap-text: #000000;
            --snap-text-gray: #707070;
            --snap-text-light: #A0A0A0;

            /* Message bubbles */
            --snap-bubble-sent: #0EADFF;
            --snap-bubble-received: #E8E8E8;

            /* Borders */
            --snap-border: #E4E4E4;

            /* Typing indicator */
            --snap-typing: #4A4A4A;

            /* Shadows */
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        body, html {
            height: 100%;
            height: 100dvh; /* Dynamic viewport height for mobile */
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--snap-bg-gray);
            color: var(--snap-text);
        }

        /* ========================================
           MAIN LAYOUT - FULL SCREEN OPTIMIZED
        ======================================== */
        .lounge-wrapper {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--snap-bg);
            max-width: 100%;
            margin: 0 auto;
            position: relative;
        }

        /* ========================================
           HEADER - MINIMAL 50PX
        ======================================== */
        .lounge-header {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--snap-bg);
            border-bottom: 1px solid var(--snap-border);
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--snap-text);
            font-size: 24px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s ease;
            border-radius: 50%;
        }

        .back-btn:hover {
            background: var(--snap-bg-gray);
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--snap-text);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-menu-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--snap-text);
            font-size: 20px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s ease;
        }

        .header-menu-btn:hover {
            background: var(--snap-bg-gray);
        }

        /* ========================================
           MESSAGES CONTAINER - TAKES ALL SPACE
        ======================================== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            background: var(--snap-bg-gray);
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        /* Custom scrollbar */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        /* ========================================
           MESSAGE BUBBLES - SNAPCHAT STYLE
        ======================================== */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            margin-bottom: 4px;
            position: relative;
        }

        .message.own {
            align-self: flex-end;
        }

        .message.other {
            align-self: flex-start;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            padding: 0 8px;
        }

        .message.own .message-header {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--snap-bg-darker);
            flex-shrink: 0;
        }

        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .message-avatar.no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 12px;
        }

        /* Rank colors for avatars - Based on purchased RANKS */
        .message-avatar.no-image.rank-bronze {
            background: linear-gradient(135deg, #CD7F32, #A0522D);
        }

        .message-avatar.no-image.rank-silver {
            background: linear-gradient(135deg, #C0C0C0, #A8A8A8);
        }

        .message-avatar.no-image.rank-vip {
            background: linear-gradient(135deg, #FFD700, #FFA500);
        }

        .message-avatar.no-image.rank-platinum {
            background: linear-gradient(135deg, #E5E4E2, #C0C0C0);
        }

        .message-avatar.no-image.rank-elite {
            background: linear-gradient(135deg, #9966CC, #7B4FB8);
        }

        .message-avatar.no-image.rank-grandmaster {
            background: linear-gradient(135deg, #FF4500, #DC143C);
        }

        .message-avatar.no-image.rank-minister {
            background: linear-gradient(135deg, #FF0000, #CC0000);
        }

        /* No rank - default gray */
        .message-avatar.no-image {
            background: linear-gradient(135deg, #6B7280, #4B5563);
        }

        .message-author {
            font-size: 12px;
            font-weight: 600;
            color: var(--snap-text-gray);
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            word-break: break-word;
            position: relative;
        }

        .message.own .message-bubble {
            background: var(--snap-bubble-sent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.other .message-bubble {
            background: var(--snap-bubble-received);
            color: var(--snap-text);
            border-bottom-left-radius: 4px;
        }

        .message-timestamp {
            font-size: 11px;
            color: var(--snap-text-light);
            margin-top: 2px;
            padding: 0 8px;
        }

        /* Delete button for moderators */
        .message-delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ef4444;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.1s ease;
            z-index: 10;
        }

        .message:hover .message-delete-btn {
            opacity: 1;
        }

        .message-delete-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .message-delete-btn:active {
            transform: scale(0.95);
        }

        /* ========================================
           SPECIAL MESSAGE TYPES
        ======================================== */

        /* Snap Messages - Exact Snapchat Style */
        .message-snap {
            min-width: 120px;
            max-width: 200px;
            height: 36px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
        }

        /* Red for image snaps (unopened) */
        .message-snap.snap-unopened {
            background: #FF3B5C;
        }

        /* Gray for opened snaps */
        .message-snap.snap-opened {
            background: #8B8B8B;
            cursor: default;
        }

        .message-snap:hover:not(.snap-opened) {
            background: #FF5070;
        }

        .snap-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .snap-icon svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        .snap-text {
            font-weight: 600;
            font-size: 14px;
            color: white;
            white-space: nowrap;
            flex: 1;
        }

        /* Voice Messages */
        .message-voice {
            background: var(--snap-bg-darker);
            border-radius: 18px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 280px;
        }

        .message.own .message-voice {
            background: rgba(14, 173, 255, 0.2);
        }

        .voice-play-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .voice-play-btn:hover {
            transform: scale(1.1);
        }

        .voice-waveform {
            flex: 1;
            height: 24px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .voice-bar {
            width: 2px;
            background: var(--snap-text-gray);
            border-radius: 1px;
            transition: height 0.1s ease;
        }

        /* Animating waveform during playback */
        .message-voice.playing .voice-bar {
            animation: waveform-pulse 0.8s ease-in-out infinite;
        }

        @keyframes waveform-pulse {
            0%, 100% {
                transform: scaleY(0.5);
            }
            50% {
                transform: scaleY(1.2);
            }
        }

        .message-voice.playing .voice-bar:nth-child(2n) {
            animation-delay: 0.1s;
        }

        .message-voice.playing .voice-bar:nth-child(3n) {
            animation-delay: 0.2s;
        }

        .message-voice.playing .voice-play-btn {
            background: var(--snap-bubble-sent);
            color: white;
        }

        .voice-duration {
            font-size: 12px;
            color: var(--snap-text-gray);
            font-weight: 500;
            flex-shrink: 0;
        }

        /* GIF Messages */
        .message-gif {
            border-radius: 12px;
            overflow: hidden;
            max-width: 280px;
            cursor: pointer;
        }

        .message-gif img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Reactions */
        .message-reactions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            padding: 0 8px;
            flex-wrap: wrap;
        }

        .reaction {
            display: flex;
            align-items: center;
            gap: 4px;
            background: white;
            border: 1.5px solid var(--snap-border);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reaction:hover {
            border-color: var(--snap-yellow-dark);
            transform: scale(1.05);
        }

        .reaction.own {
            background: rgba(14, 173, 255, 0.1);
            border-color: var(--snap-bubble-sent);
        }

        .reaction-emoji {
            font-size: 14px;
        }

        .reaction-count {
            font-size: 11px;
            font-weight: 600;
            color: var(--snap-text-gray);
        }

        /* ========================================
           TYPING INDICATOR
        ======================================== */
        .typing-indicator {
            position: absolute;
            bottom: 120px;
            left: 16px;
            background: white;
            border: 1px solid var(--snap-border);
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 13px;
            color: var(--snap-text-gray);
            box-shadow: var(--shadow-sm);
            display: none;
            z-index: 50;
            animation: slideUp 0.2s ease;
        }

        .typing-indicator.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================================
           ONLINE USERS BAR - 60PX
        ======================================== */
        .online-users-bar {
            height: 82px;
            flex-shrink: 0;
            background: var(--snap-bg);
            border-top: 1px solid var(--snap-border);
            padding: 14px 12px 12px;
            display: flex;
            gap: 14px;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .online-users-bar::-webkit-scrollbar {
            display: none;
        }

        .online-user {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .online-user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--snap-bg-darker);
            overflow: hidden;
            border: 2px solid var(--snap-yellow);
            position: relative;
        }

        .online-user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .online-user-avatar.no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
        }

        /* Rank colors for online user avatars - Based on purchased RANKS */
        .online-user-avatar.no-image.rank-bronze {
            background: linear-gradient(135deg, #CD7F32, #A0522D);
            border-color: #CD7F32;
        }

        .online-user-avatar.no-image.rank-silver {
            background: linear-gradient(135deg, #C0C0C0, #A8A8A8);
            border-color: #C0C0C0;
        }

        .online-user-avatar.no-image.rank-vip {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-color: #FFD700;
        }

        .online-user-avatar.no-image.rank-platinum {
            background: linear-gradient(135deg, #E5E4E2, #C0C0C0);
            border-color: #E5E4E2;
        }

        .online-user-avatar.no-image.rank-elite {
            background: linear-gradient(135deg, #9966CC, #7B4FB8);
            border-color: #9966CC;
        }

        .online-user-avatar.no-image.rank-grandmaster {
            background: linear-gradient(135deg, #FF4500, #DC143C);
            border-color: #FF4500;
        }

        .online-user-avatar.no-image.rank-minister {
            background: linear-gradient(135deg, #FF0000, #CC0000);
            border-color: #FF0000;
        }

        /* No rank - default gray */
        .online-user-avatar.no-image {
            background: linear-gradient(135deg, #6B7280, #4B5563);
            border-color: #6B7280;
        }

        .online-user-name {
            font-size: 11px;
            color: var(--snap-text-gray);
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }

        /* ========================================
           MESSAGE INPUT BAR - 50PX
        ======================================== */
        .message-input-bar {
            height: 50px;
            flex-shrink: 0;
            background: var(--snap-bg);
            border-top: 1px solid var(--snap-border);
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            position: relative;
        }

        .input-action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--snap-bg-gray);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .input-action-btn:hover {
            background: var(--snap-bg-darker);
            transform: scale(1.05);
        }

        .message-input {
            flex: 1;
            border: none;
            background: var(--snap-bg-gray);
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            color: var(--snap-text);
        }

        .message-input::placeholder {
            color: var(--snap-text-light);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--snap-bubble-sent);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            background: #0C8FD6;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: var(--snap-bg-darker);
            cursor: not-allowed;
            transform: scale(1);
        }

        /* ========================================
           CAMERA MODAL
        ======================================== */
        .camera-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
            flex-direction: column;
        }

        .camera-modal.active {
            display: flex;
        }

        .camera-header {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(0, 0, 0, 0.8);
        }

        .camera-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-preview {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            width: min(90vw, 520px);
            max-width: 520px;
            aspect-ratio: 9 / 16;
            margin: 0 auto;
            background: black;
            border-radius: 16px;
        }

        .camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scaleX(-1); /* Mirror for natural selfie orientation */
        }

        .camera-canvas {
            display: none;
        }

        .camera-controls {
            height: 100px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background: rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .camera-capture-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: white;
            border: 4px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: transform 0.2s ease;
            position: relative;
            z-index: 11;
            pointer-events: auto;
        }

        .camera-capture-btn:hover {
            transform: scale(1.1);
        }

        .camera-capture-btn:active {
            transform: scale(0.95);
        }

        .camera-switch-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 11;
            pointer-events: auto;
        }

        .camera-switch-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .camera-switch-btn:active {
            transform: scale(0.9);
        }

        /* ========================================
           VOICE RECORDING MODAL
        ======================================== */
        .voice-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .voice-modal.active {
            display: flex;
        }

        .voice-modal-content {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .voice-timer {
            font-size: 32px;
            font-weight: 700;
            color: var(--snap-text);
        }

        .voice-recording-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #EF4444;
            animation: pulse 1s ease infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .voice-controls {
            display: flex;
            gap: 16px;
        }

        .voice-control-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .voice-control-btn:hover {
            transform: scale(1.1);
        }

        .voice-cancel-btn {
            background: #EF4444;
            color: white;
        }

        .voice-send-btn {
            background: var(--snap-bubble-sent);
            color: white;
        }

        /* ========================================
           GIF PICKER MODAL
        ======================================== */
        .gif-modal {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 400px;
            background: white;
            z-index: 900;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.2);
            animation: slideUpModal 0.3s ease;
        }

        .gif-modal.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes slideUpModal {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .gif-modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--snap-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gif-modal-title {
            font-size: 16px;
            font-weight: 700;
        }

        .gif-close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--snap-bg-gray);
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gif-search-bar {
            padding: 12px 16px;
            border-bottom: 1px solid var(--snap-border);
        }

        .gif-search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--snap-border);
            border-radius: 18px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }

        .gif-grid {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            align-content: start;
        }

        .gif-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .gif-item:hover {
            transform: scale(1.05);
        }

        .gif-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ========================================
           SNAP VIEW MODAL
        ======================================== */
        .snap-view-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
            flex-direction: column;
        }

        .snap-view-modal.active {
            display: flex;
        }

        .snap-view-header {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(0, 0, 0, 0.8);
        }

        .snap-view-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .snap-view-username {
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .snap-view-image {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .snap-view-image img {
            width: auto;
            max-width: min(70vw, 520px);
            height: 90vh;
            max-height: 90vh;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
        }

        /* ========================================
           REACTION PICKER
        ======================================== */
        .reaction-picker {
            display: none;
            position: fixed;
            background: white;
            border-radius: 24px;
            padding: 12px;
            box-shadow: var(--shadow-lg);
            z-index: 500;
            flex-wrap: wrap;
            gap: 8px;
            max-width: 280px;
        }

        .reaction-picker.active {
            display: flex;
        }

        .reaction-option {
            font-size: 28px;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .reaction-option:hover {
            transform: scale(1.2);
            background: var(--snap-bg-gray);
        }

        /* ========================================
           MOBILE RESPONSIVE
        ======================================== */
        @media (max-width: 768px) {
            .message {
                max-width: 85%;
            }

            .message-snap {
                min-width: 100px;
                max-width: 160px;
                height: 32px;
                font-size: 13px;
            }

            .snap-icon svg {
                width: 14px;
                height: 14px;
            }

            .gif-modal {
                height: 350px;
            }

            .voice-modal-content {
                max-width: 320px;
            }
        }

        /* ========================================
           LOADING STATE
        ======================================== */
        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--snap-bg-gray);
            border-top-color: var(--snap-bubble-sent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <!-- Main Lounge Wrapper -->
    <div class="lounge-wrapper">
        <!-- Header -->
        <div class="lounge-header">
            <div class="header-left">
                <a href="{{ url_for('index') }}" class="back-btn">←</a>
                <div class="header-title">Study Hall</div>
            </div>
            <div class="header-right">
                <button class="header-menu-btn" onclick="alert('Menu coming soon!')">⋮</button>
            </div>
        </div>

        <!-- Messages Container -->
        <div class="messages-container" id="messagesContainer">
            <!-- Messages will be dynamically inserted here -->
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <span id="typingUsers"></span>
        </div>

        <!-- Online Users Bar -->
        <div class="online-users-bar" id="onlineUsersBar">
            <!-- Online users will be dynamically inserted here -->
        </div>

        <!-- Message Input Bar -->
        <div class="message-input-bar">
            <button class="input-action-btn" id="snapBtn" title="Take a snap">📷</button>
            <button class="input-action-btn" id="voiceBtn" title="Record voice">🎤</button>
            <button class="input-action-btn" id="gifBtn" title="Send GIF">GIF</button>
            <input
                type="text"
                class="message-input"
                id="messageInput"
                placeholder="Send a message..."
                autocomplete="off"
            >
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <!-- Camera Modal -->
    <div class="camera-modal" id="cameraModal">
        <div class="camera-header">
            <button class="camera-close-btn" id="cameraCloseBtn">×</button>
        </div>
        <div class="camera-preview">
            <video class="camera-video" id="cameraVideo" autoplay playsinline></video>
            <canvas class="camera-canvas" id="cameraCanvas"></canvas>
        </div>
        <div class="camera-controls">
            <button class="camera-switch-btn" id="cameraSwitchBtn">🔄</button>
            <button class="camera-capture-btn" id="cameraCaptureBtn"></button>
        </div>
    </div>

    <!-- Voice Recording Modal -->
    <div class="voice-modal" id="voiceModal">
        <div class="voice-modal-content">
            <div class="voice-recording-indicator"></div>
            <div class="voice-timer" id="voiceTimer">00:00</div>
            <div class="voice-controls">
                <button class="voice-control-btn voice-cancel-btn" id="voiceCancelBtn">×</button>
                <button class="voice-control-btn voice-send-btn" id="voiceSendBtn">✓</button>
            </div>
        </div>
    </div>

    <!-- GIF Picker Modal -->
    <div class="gif-modal" id="gifModal">
        <div class="gif-modal-header">
            <div class="gif-modal-title">Choose a GIF</div>
            <button class="gif-close-btn" id="gifCloseBtn">×</button>
        </div>
        <div class="gif-search-bar">
            <input
                type="text"
                class="gif-search-input"
                id="gifSearchInput"
                placeholder="Search GIFs..."
            >
        </div>
        <div class="gif-grid" id="gifGrid">
            <!-- GIFs will be loaded here -->
        </div>
    </div>

    <!-- Snap View Modal -->
    <div class="snap-view-modal" id="snapViewModal">
        <div class="snap-view-header">
            <button class="snap-view-close-btn" id="snapViewCloseBtn">×</button>
            <div class="snap-view-username" id="snapViewUsername"></div>
            <div></div>
        </div>
        <div class="snap-view-image" id="snapViewImage">
            <!-- Snap image will be displayed here -->
        </div>
    </div>

    <!-- Reaction Picker -->
    <div class="reaction-picker" id="reactionPicker">
        <div class="reaction-option" data-emoji="❤️">❤️</div>
        <div class="reaction-option" data-emoji="😂">😂</div>
        <div class="reaction-option" data-emoji="😮">😮</div>
        <div class="reaction-option" data-emoji="😢">😢</div>
        <div class="reaction-option" data-emoji="👍">👍</div>
        <div class="reaction-option" data-emoji="👎">👎</div>
        <div class="reaction-option" data-emoji="🔥">🔥</div>
        <div class="reaction-option" data-emoji="🎉">🎉</div>
    </div>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script>
        // ========================================
        // GLOBAL STATE
        // ========================================
        const currentUser = "{{ session.get('username', '') }}";
        const currentUserRole = "{{ user_role }}";
        const socket = io();

        let currentFacingMode = 'user';
        let cameraStream = null;
        let voiceRecorder = null;
        let voiceChunks = [];
        let voiceTimer = null;
        let voiceSeconds = 0;
        let currentReactionMessageId = null;

        const profilePictureCache = {};
        const profileRankCache = {};
        const typingUsers = new Set();

        async function getProfileMeta(username) {
            if (profilePictureCache[username] !== undefined && profileRankCache[username] !== undefined) {
                return {
                    profilePicture: profilePictureCache[username],
                    rank: profileRankCache[username]
                };
            }

            try {
                const profileResponse = await fetch(`/api/get_profile/${username}`);
                const profileData = await profileResponse.json();

                const picture = profileData.profile_picture || null;
                const rank = profileData.rank || 'member';

                profilePictureCache[username] = picture;
                profileRankCache[username] = rank;

                return { profilePicture: picture, rank: rank };
            } catch (error) {
                profilePictureCache[username] = null;
                profileRankCache[username] = 'member';
                return { profilePicture: null, rank: 'member' };
            }
        }

        // ========================================
        // WEBSOCKET EVENTS
        // ========================================

        // Join lounge on page load
        socket.emit('join_lounge');

        // New message received
        socket.on('new_lounge_message', async (data) => {
            let profilePicture = data.profile_picture || null;
            let userRank = data.user_rank || null;

            if (data.message.from !== currentUser) {
                // Cache provided data
                if (profilePicture !== null) {
                    profilePictureCache[data.message.from] = profilePicture;
                } else if (profilePictureCache[data.message.from] !== undefined) {
                    profilePicture = profilePictureCache[data.message.from];
                }

                if (userRank) {
                    profileRankCache[data.message.from] = userRank;
                } else if (profileRankCache[data.message.from] !== undefined) {
                    userRank = profileRankCache[data.message.from];
                }

                // Fetch missing profile meta when needed
                if (profilePicture === null || !userRank) {
                    const meta = await getProfileMeta(data.message.from);
                    if (profilePicture === null) profilePicture = meta.profilePicture;
                    if (!userRank) userRank = meta.rank;
                }
            }

            // Ensure snap messages have an index for opening
            if (typeof data.message.index === 'undefined') {
                data.message.index = document.getElementById('messagesContainer').children.length;
            }

            appendMessage(data.message, profilePicture, userRank);
            scrollToBottom();
        });

        // User joined
        socket.on('user_joined', (data) => {
            console.log(`${data.username} joined`);
            // Online users will be updated via online_users_update event
        });

        // User left
        socket.on('user_left', (data) => {
            console.log(`${data.username} left`);
            // Online users will be updated via online_users_update event
        });

        // Online users update
        socket.on('online_users_update', (data) => {
            updateOnlineUsers(data.users);
        });

        // Typing indicator
        socket.on('user_typing', (data) => {
            if (data.username !== currentUser) {
                typingUsers.add(data.username);
                updateTypingIndicator();
            }
        });

        socket.on('user_stop_typing', (data) => {
            typingUsers.delete(data.username);
            updateTypingIndicator();
        });

        // Message deleted by moderator
        socket.on('message_deleted', (data) => {
            console.log('Message deleted at index:', data.message_index);
            // Reload messages to reflect deletion
            loadMessages();
        });

        // Leave lounge on page unload
        window.addEventListener('beforeunload', () => {
            socket.emit('leave_lounge');
        });

        // ========================================
        // MESSAGE RENDERING
        // ========================================

        function appendMessage(message, profilePicture = null, userRank = null) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.from === currentUser ? 'own' : 'other'}`;

            // Message header with avatar
            const headerDiv = document.createElement('div');
            headerDiv.className = 'message-header';

            if (message.from !== currentUser) {
                const avatar = document.createElement('div');
                avatar.className = 'message-avatar';

                if (profilePicture) {
                    const img = document.createElement('img');
                    img.src = profilePicture;
                    avatar.appendChild(img);
                } else {
                    avatar.classList.add('no-image');
                    // Add rank class based on user role
                    if (userRank && userRank !== 'member') {
                        avatar.classList.add(`rank-${userRank}`);
                    }
                    avatar.textContent = message.from.charAt(0).toUpperCase();
                }

                headerDiv.appendChild(avatar);

                const authorSpan = document.createElement('span');
                authorSpan.className = 'message-author';
                authorSpan.textContent = message.from;
                headerDiv.appendChild(authorSpan);
            }

            messageDiv.appendChild(headerDiv);

            // Message content based on type
            if (message.type === 'snap') {
                const snapDiv = document.createElement('div');
                const isOwnSnap = message.from === currentUser;
                const isOpened = message.opened_by && message.opened_by.includes(currentUser);

                // Own snaps always show as "sent" (gray)
                snapDiv.className = `message-snap ${isOwnSnap || isOpened ? 'snap-opened' : 'snap-unopened'}`;
                snapDiv.dataset.messageIndex = message.index;
                snapDiv.dataset.snapFrom = message.from;

                // Only allow viewing if not own snap and not already opened
                if (!isOwnSnap && !isOpened) {
                    snapDiv.onclick = () => viewSnap(message.index, message.from);
                }

                // Camera/Image icon (SVG square)
                const iconDiv = document.createElement('div');
                iconDiv.className = 'snap-icon';
                iconDiv.innerHTML = `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="white"/></svg>`;
                snapDiv.appendChild(iconDiv);

                // Snap text
                const text = document.createElement('div');
                text.className = 'snap-text';
                text.textContent = isOwnSnap ? 'Sent' : (isOpened ? 'Opened' : 'Snap');
                snapDiv.appendChild(text);

                messageDiv.appendChild(snapDiv);
            } else if (message.type === 'voice') {
                const voiceDiv = document.createElement('div');
                voiceDiv.className = 'message-voice';

                const playBtn = document.createElement('button');
                playBtn.className = 'voice-play-btn';
                playBtn.textContent = '▶';
                playBtn.onclick = () => playVoiceMessage(message.audio, voiceDiv); // Pass voiceDiv for animation
                voiceDiv.appendChild(playBtn);

                const waveform = document.createElement('div');
                waveform.className = 'voice-waveform';
                // Generate random waveform bars
                for (let i = 0; i < 20; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'voice-bar';
                    bar.style.height = `${Math.random() * 20 + 4}px`;
                    waveform.appendChild(bar);
                }
                voiceDiv.appendChild(waveform);

                const duration = document.createElement('div');
                duration.className = 'voice-duration';
                // Format duration from seconds to mm:ss
                const durationSecs = message.duration || 0;
                const mins = Math.floor(durationSecs / 60);
                const secs = durationSecs % 60;
                duration.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
                voiceDiv.appendChild(duration);

                messageDiv.appendChild(voiceDiv);
            } else if (message.type === 'gif') {
                const gifDiv = document.createElement('div');
                gifDiv.className = 'message-gif';

                const img = document.createElement('img');
                img.src = message.gif_url;
                gifDiv.appendChild(img);

                messageDiv.appendChild(gifDiv);
            } else {
                // Regular text message
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = message.message;
                bubble.ondblclick = () => showReactionPicker(event, message.id);
                messageDiv.appendChild(bubble);
            }

            // Timestamp
            const timestamp = document.createElement('div');
            timestamp.className = 'message-timestamp';
            timestamp.textContent = message.display_time || message.timestamp;
            messageDiv.appendChild(timestamp);

            // Reactions (if any)
            if (message.reactions && Object.keys(message.reactions).length > 0) {
                const reactionsDiv = document.createElement('div');
                reactionsDiv.className = 'message-reactions';

                for (const [emoji, users] of Object.entries(message.reactions)) {
                    const reactionDiv = document.createElement('div');
                    reactionDiv.className = `reaction ${users.includes(currentUser) ? 'own' : ''}`;
                    reactionDiv.onclick = () => toggleReaction(message.id, emoji);

                    const emojiSpan = document.createElement('span');
                    emojiSpan.className = 'reaction-emoji';
                    emojiSpan.textContent = emoji;
                    reactionDiv.appendChild(emojiSpan);

                    const countSpan = document.createElement('span');
                    countSpan.className = 'reaction-count';
                    countSpan.textContent = users.length;
                    reactionDiv.appendChild(countSpan);

                    reactionsDiv.appendChild(reactionDiv);
                }

                messageDiv.appendChild(reactionsDiv);
            }

            // Delete button for admin and master moderators only
            if (currentUserRole === 'admin' || currentUserRole === 'master') {
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'message-delete-btn';
                deleteBtn.innerHTML = '×';
                deleteBtn.title = 'Delete message';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteMessage(message.index);
                };
                messageDiv.appendChild(deleteBtn);
            }

            container.appendChild(messageDiv);
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        // ========================================
        // ONLINE USERS
        // ========================================

        function updateOnlineUsers(users) {
            const container = document.getElementById('onlineUsersBar');
            container.innerHTML = '';

            for (const user of users) {
                const userDiv = document.createElement('div');
                userDiv.className = 'online-user';
                userDiv.dataset.username = user.username;

                const avatar = document.createElement('div');
                avatar.className = 'online-user-avatar';

                if (user.profile_picture) {
                    const img = document.createElement('img');
                    img.src = user.profile_picture;
                    avatar.appendChild(img);
                } else {
                    avatar.classList.add('no-image');
                    // Add rank class based on user role
                    if (user.rank && user.rank !== 'member') {
                        avatar.classList.add(`rank-${user.rank}`);
                    }
                    avatar.textContent = user.username.charAt(0).toUpperCase();
                }

                const name = document.createElement('div');
                name.className = 'online-user-name';
                name.textContent = user.username;

                userDiv.appendChild(avatar);
                userDiv.appendChild(name);
                container.appendChild(userDiv);
            }
        }

        // ========================================
        // TYPING INDICATOR
        // ========================================

        function updateTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            const usersSpan = document.getElementById('typingUsers');

            if (typingUsers.size === 0) {
                indicator.classList.remove('show');
            } else {
                const names = Array.from(typingUsers);
                if (names.length === 1) {
                    usersSpan.textContent = `${names[0]} is typing...`;
                } else if (names.length === 2) {
                    usersSpan.textContent = `${names[0]} and ${names[1]} are typing...`;
                } else {
                    usersSpan.textContent = `${names.length} people are typing...`;
                }
                indicator.classList.add('show');
            }
        }

        let typingTimeout;
        document.getElementById('messageInput').addEventListener('input', () => {
            socket.emit('lounge_typing');
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('lounge_stop_typing');
            }, 1000);
        });

        // ========================================
        // SEND MESSAGE
        // ========================================

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            socket.emit('send_lounge_message', { message: message });
            input.value = '';
            socket.emit('lounge_stop_typing');
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // ========================================
        // CAMERA / SNAP
        // ========================================

        document.getElementById('snapBtn').addEventListener('click', async () => {
            const modal = document.getElementById('cameraModal');
            const video = document.getElementById('cameraVideo');

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 720 },
                        height: { ideal: 1280 },
                        aspectRatio: { ideal: 9 / 16 }
                    },
                    audio: false
                });
                video.srcObject = cameraStream;
                modal.classList.add('active');
            } catch (error) {
                console.error('Camera error:', error);
                alert('Unable to access camera. Please check permissions.');
            }
        });

        document.getElementById('cameraCloseBtn').addEventListener('click', () => {
            closeCamera();
        });

        document.getElementById('cameraSwitchBtn').addEventListener('click', async () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            closeCamera();
            document.getElementById('snapBtn').click();
        });

        document.getElementById('cameraCaptureBtn').addEventListener('click', async () => {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('cameraCanvas');
            const ctx = canvas.getContext('2d');

            // Capture in a tall 9:16 (iPhone-style) frame
            const sourceWidth = video.videoWidth || video.clientWidth || 1080;
            const sourceHeight = video.videoHeight || video.clientHeight || 1920;
            const targetWidth = 720;
            const targetHeight = 1280;

            const scale = Math.max(targetWidth / sourceWidth, targetHeight / sourceHeight);
            const drawWidth = targetWidth / scale;
            const drawHeight = targetHeight / scale;
            const dx = (sourceWidth - drawWidth) / 2;
            const dy = (sourceHeight - drawHeight) / 2;

            canvas.width = targetWidth;
            canvas.height = targetHeight;

            // Mirror horizontally so preview and captured snap match orientation
            ctx.save();
            ctx.translate(targetWidth, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, dx, dy, drawWidth, drawHeight, 0, 0, targetWidth, targetHeight);
            ctx.restore();

            const imageData = canvas.toDataURL('image/jpeg', 0.8);

            closeCamera();

            // Send snap via HTTP POST (existing backend route)
            try {
                const response = await fetch('/lounge/send_snap', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ photo: imageData })
                });

                if (response.ok) {
                    // Snap will broadcast to everyone (including you) via WebSocket
                } else {
                    alert('Failed to send snap. Please try again.');
                }
            } catch (error) {
                console.error('Error sending snap:', error);
                alert('Failed to send snap. Please try again.');
            }
        });

        function closeCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            document.getElementById('cameraModal').classList.remove('active');
        }

        // ========================================
        // VOICE RECORDING
        // ========================================

        document.getElementById('voiceBtn').addEventListener('click', async () => {
            const modal = document.getElementById('voiceModal');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                // Try to use audio/mp4 codec for better compatibility, fallback to webm
                let options = { mimeType: 'audio/webm' };
                if (MediaRecorder.isTypeSupported('audio/mp4')) {
                    options = { mimeType: 'audio/mp4' };
                } else if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                    options = { mimeType: 'audio/webm;codecs=opus' };
                }

                voiceRecorder = new MediaRecorder(stream, options);
                voiceChunks = [];
                voiceSeconds = 0;

                voiceRecorder.ondataavailable = (e) => {
                    voiceChunks.push(e.data);
                };

                voiceRecorder.start();
                modal.classList.add('active');

                voiceTimer = setInterval(() => {
                    voiceSeconds++;
                    const mins = Math.floor(voiceSeconds / 60);
                    const secs = voiceSeconds % 60;
                    document.getElementById('voiceTimer').textContent =
                        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                }, 1000);
            } catch (error) {
                console.error('Microphone error:', error);
                alert('Unable to access microphone. Please check permissions.');
            }
        });

        document.getElementById('voiceCancelBtn').addEventListener('click', () => {
            stopVoiceRecording();
            document.getElementById('voiceModal').classList.remove('active');
        });

        document.getElementById('voiceSendBtn').addEventListener('click', () => {
            voiceRecorder.onstop = async () => {
                // Use the same MIME type as the recorder
                const mimeType = voiceRecorder.mimeType || 'audio/webm';
                const blob = new Blob(voiceChunks, { type: mimeType });
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const audioData = reader.result;
                    const durationSecs = voiceSeconds;

                    // Send voice message via HTTP POST (existing backend route)
                    try {
                        const response = await fetch('/lounge/send_voice', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                audio: audioData,
                                duration: durationSecs
                            })
                        });

                        if (response.ok) {
                            // Reload messages to show new voice message
                            await loadMessages();
                        } else {
                            alert('Failed to send voice message. Please try again.');
                        }
                    } catch (error) {
                        console.error('Error sending voice message:', error);
                        alert('Failed to send voice message. Please try again.');
                    }
                };
                reader.readAsDataURL(blob);
            };

            stopVoiceRecording();
            document.getElementById('voiceModal').classList.remove('active');
        });

        function stopVoiceRecording() {
            if (voiceRecorder && voiceRecorder.state !== 'inactive') {
                voiceRecorder.stop();
                voiceRecorder.stream.getTracks().forEach(track => track.stop());
            }
            clearInterval(voiceTimer);
            document.getElementById('voiceTimer').textContent = '00:00';
        }

        // Track currently playing audio to prevent overlaps
        let currentAudio = null;
        let currentPlayingVoiceDiv = null;

        function playVoiceMessage(audioData, voiceDiv) {
            try {
                // Stop any currently playing audio
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    if (currentPlayingVoiceDiv) {
                        currentPlayingVoiceDiv.classList.remove('playing');
                    }
                }

                console.log('Attempting to play audio...');
                console.log('Audio data length:', audioData ? audioData.length : 'null');
                console.log('Audio data start:', audioData ? audioData.substring(0, 50) : 'null');

                // Validate audio data
                if (!audioData || !audioData.startsWith('data:audio')) {
                    console.error('Invalid audio data format:', audioData ? audioData.substring(0, 100) : 'null');
                    alert('Invalid audio format. Please try recording again.');
                    return;
                }

                const audio = new Audio();
                currentAudio = audio;
                currentPlayingVoiceDiv = voiceDiv;

                // Add comprehensive event listeners
                audio.addEventListener('loadstart', () => {
                    console.log('Audio loading started');
                });

                audio.addEventListener('loadedmetadata', () => {
                    console.log('Audio metadata loaded, duration:', audio.duration);
                });

                audio.addEventListener('loadeddata', () => {
                    console.log('Audio data loaded successfully');
                });

                audio.addEventListener('canplay', () => {
                    console.log('Audio can start playing');
                });

                audio.addEventListener('playing', () => {
                    console.log('Audio is playing');
                    // Add playing class to animate waveform
                    if (voiceDiv) {
                        voiceDiv.classList.add('playing');
                    }
                });

                audio.addEventListener('ended', () => {
                    console.log('Audio playback ended');
                    // Remove playing class
                    if (voiceDiv) {
                        voiceDiv.classList.remove('playing');
                    }
                    currentAudio = null;
                    currentPlayingVoiceDiv = null;
                });

                audio.addEventListener('pause', () => {
                    // Remove playing class when paused
                    if (voiceDiv) {
                        voiceDiv.classList.remove('playing');
                    }
                });

                audio.addEventListener('error', (e) => {
                    console.error('Audio error event:', e);
                    console.error('Audio error code:', audio.error ? audio.error.code : 'unknown');
                    console.error('Audio error message:', audio.error ? audio.error.message : 'unknown');

                    let errorMsg = 'Unable to play voice message. ';
                    if (audio.error) {
                        switch(audio.error.code) {
                            case 1: errorMsg += 'Loading aborted.'; break;
                            case 2: errorMsg += 'Network error.'; break;
                            case 3: errorMsg += 'Decoding failed - unsupported format.'; break;
                            case 4: errorMsg += 'Audio format not supported.'; break;
                            default: errorMsg += 'Unknown error.';
                        }
                    }
                    alert(errorMsg);
                    if (voiceDiv) {
                        voiceDiv.classList.remove('playing');
                    }
                    currentAudio = null;
                    currentPlayingVoiceDiv = null;
                });

                // Set source and load
                audio.src = audioData;
                audio.load(); // Explicitly load the audio

                // Try to play with user interaction requirement handling
                const playPromise = audio.play();

                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log('Playback started successfully');
                        })
                        .catch(error => {
                            console.error('Play failed:', error);
                            if (error.name === 'NotAllowedError') {
                                alert('Please interact with the page first to enable audio playback.');
                            } else if (error.name === 'NotSupportedError') {
                                alert('Audio format not supported by your browser.');
                            } else {
                                alert('Unable to play voice message: ' + error.message);
                            }
                            if (voiceDiv) {
                                voiceDiv.classList.remove('playing');
                            }
                            currentAudio = null;
                            currentPlayingVoiceDiv = null;
                        });
                }
            } catch (error) {
                console.error('Error creating/playing audio:', error);
                alert('Unable to play voice message: ' + error.message);
                if (voiceDiv) {
                    voiceDiv.classList.remove('playing');
                }
                currentAudio = null;
                currentPlayingVoiceDiv = null;
            }
        }

        // ========================================
        // GIF PICKER
        // ========================================

        // Using Giphy API with public beta key
        const GIPHY_API_KEY = 'sXpGFDGZs0Dv1mmNFvYaGUvYwKX0PWIh';

        document.getElementById('gifBtn').addEventListener('click', () => {
            document.getElementById('gifModal').classList.add('active');
            loadTrendingGifs();
        });

        document.getElementById('gifCloseBtn').addEventListener('click', () => {
            document.getElementById('gifModal').classList.remove('active');
        });

        let gifSearchTimeout;
        document.getElementById('gifSearchInput').addEventListener('input', (e) => {
            clearTimeout(gifSearchTimeout);
            const query = e.target.value.trim();

            if (query) {
                gifSearchTimeout = setTimeout(() => {
                    searchGifs(query);
                }, 500);
            } else {
                loadTrendingGifs();
            }
        });

        async function loadTrendingGifs() {
            const grid = document.getElementById('gifGrid');
            grid.innerHTML = '<div style="color: var(--snap-text-gray); padding: 20px; text-align: center;">Loading...</div>';

            try {
                const response = await fetch(
                    `https://api.giphy.com/v1/gifs/trending?api_key=${GIPHY_API_KEY}&limit=20&rating=g`
                );
                const data = await response.json();
                console.log('Loaded trending GIFs:', data);

                if (data.data && data.data.length > 0) {
                    displayGifs(data.data);
                } else {
                    grid.innerHTML = '<div style="color: var(--snap-text-gray); padding: 20px; text-align: center;">No GIFs found</div>';
                }
            } catch (error) {
                console.error('Error loading GIFs:', error);
                grid.innerHTML = '<div style="color: #f87171; padding: 20px; text-align: center;">Failed to load GIFs. Please try again.</div>';
            }
        }

        async function searchGifs(query) {
            const grid = document.getElementById('gifGrid');
            grid.innerHTML = '<div style="color: var(--snap-text-gray); padding: 20px; text-align: center;">Searching...</div>';

            try {
                const response = await fetch(
                    `https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_API_KEY}&q=${encodeURIComponent(query)}&limit=20&rating=g`
                );
                const data = await response.json();
                console.log('Search results:', data);

                if (data.data && data.data.length > 0) {
                    displayGifs(data.data);
                } else {
                    grid.innerHTML = '<div style="color: var(--snap-text-gray); padding: 20px; text-align: center;">No GIFs found for "' + query + '"</div>';
                }
            } catch (error) {
                console.error('Error searching GIFs:', error);
                grid.innerHTML = '<div style="color: #f87171; padding: 20px; text-align: center;">Search failed. Please try again.</div>';
            }
        }

        function displayGifs(gifs) {
            const grid = document.getElementById('gifGrid');
            grid.innerHTML = '';

            if (!gifs || gifs.length === 0) {
                grid.innerHTML = '<div style="color: var(--snap-text-gray); padding: 20px; text-align: center;">No GIFs available</div>';
                return;
            }

            for (const gif of gifs) {
                const gifDiv = document.createElement('div');
                gifDiv.className = 'gif-item';

                const img = document.createElement('img');
                // Use fixed_height_small for preview, original for sending
                img.src = gif.images.fixed_height_small.url;
                img.alt = gif.title || 'GIF';
                img.loading = 'lazy';

                gifDiv.onclick = () => {
                    // Send the original GIF URL
                    sendGif(gif.images.original.url);
                };

                gifDiv.appendChild(img);
                grid.appendChild(gifDiv);
            }
        }

        async function sendGif(gifUrl) {
            try {
                const response = await fetch('/lounge/send_gif', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ gif_url: gifUrl })
                });

                if (response.ok) {
                    document.getElementById('gifModal').classList.remove('active');
                }
            } catch (error) {
                console.error('Error sending GIF:', error);
            }
        }

        // ========================================
        // MESSAGE DELETION (ADMIN/MASTER ONLY)
        // ========================================

        async function deleteMessage(messageIndex) {
            try {
                const response = await fetch(`/lounge/delete_message/${messageIndex}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    // Reload messages to reflect deletion
                    await loadMessages();
                } else {
                    alert(data.error || 'Failed to delete message.');
                }
            } catch (error) {
                console.error('Error deleting message:', error);
                alert('Failed to delete message. Please try again.');
            }
        }

        // ========================================
        // SNAP VIEWING
        // ========================================

        function viewSnap(messageIndex, snapFrom) {
            const modal = document.getElementById('snapViewModal');
            const username = document.getElementById('snapViewUsername');
            const imageContainer = document.getElementById('snapViewImage');

            username.textContent = snapFrom;

            // Open snap via backend route
            fetch(`/lounge/open_snap/${messageIndex}`, {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.photo) {
                        imageContainer.innerHTML = `<img src="${data.photo}" alt="Snap">`;
                        modal.classList.add('active');
                        // Reload messages to update viewed status
                        loadMessages();
                    } else if (data.error) {
                        alert(data.error);
                    }
                })
                .catch(error => {
                    console.error('Error viewing snap:', error);
                    alert('Failed to open snap.');
                });
        }

        document.getElementById('snapViewCloseBtn').addEventListener('click', () => {
            document.getElementById('snapViewModal').classList.remove('active');
        });

        // ========================================
        // REACTIONS
        // ========================================

        function showReactionPicker(event, messageId) {
            const picker = document.getElementById('reactionPicker');
            currentReactionMessageId = messageId;

            picker.style.left = `${event.clientX - 140}px`;
            picker.style.top = `${event.clientY - 60}px`;
            picker.classList.add('active');
        }

        document.querySelectorAll('.reaction-option').forEach(option => {
            option.addEventListener('click', () => {
                const emoji = option.dataset.emoji;
                if (currentReactionMessageId) {
                    toggleReaction(currentReactionMessageId, emoji);
                }
                document.getElementById('reactionPicker').classList.remove('active');
            });
        });

        function toggleReaction(messageId, emoji) {
            fetch('/lounge/react', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message_id: messageId,
                    emoji: emoji
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Reload messages to show updated reactions
                    loadMessages();
                }
            })
            .catch(error => {
                console.error('Error toggling reaction:', error);
            });
        }

        // Close reaction picker when clicking outside
        document.addEventListener('click', (e) => {
            const picker = document.getElementById('reactionPicker');
            if (!picker.contains(e.target) && !e.target.closest('.message-bubble')) {
                picker.classList.remove('active');
            }
        });

        // ========================================
        // LOAD INITIAL MESSAGES
        // ========================================

        async function loadMessages() {
            try {
                const response = await fetch('/lounge/messages');
                const data = await response.json();

                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';

                for (let i = 0; i < data.messages.length; i++) {
                    const message = data.messages[i];
                    message.index = i; // Add index for snap viewing

                    let profilePic = null;
                    let userRank = null;

                    if (message.from !== currentUser) {
                        const meta = await getProfileMeta(message.from);
                        profilePic = meta.profilePicture;
                        userRank = meta.rank;
                    }

                    appendMessage(message, profilePic, userRank);
                }

                scrollToBottom();
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // Load messages on page load
        loadMessages();

        // ========================================
        // HEARTBEAT (for general activity tracking)
        // ========================================

        setInterval(() => {
            fetch('/heartbeat', { method: 'POST' }).catch(console.error);
        }, 15000);
    </script>
